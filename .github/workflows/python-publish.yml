# Publish to PyPI when a GitHub Release is published.
#
# Uses trusted publishing (OIDC), so there is no API token to store: configure
# the publisher once at https://pypi.org/manage/account/publishing/ against this
# repository, this workflow filename, and the `pypi` environment below.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: The release tag must match the version we are about to publish
        run: |
          uv run --frozen python - <<'PY'
          import os, re, tomllib
          tag = os.environ["TAG"].lstrip("v")
          proj = tomllib.loads(open("pyproject.toml", "rb").read().decode())["project"]["version"]
          mod = re.search(r'^__version__ = "([^"]+)"', open("claude_sessions.py", encoding="utf-8").read(), re.M)[1]
          assert tag == proj == mod, f"version mismatch: tag={tag} pyproject={proj} __version__={mod}"
          print(f"ok: publishing {proj}")
          PY
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Test before publishing
        run: uv run --frozen pytest -q

      - name: Build release distributions
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: [release-build]
    permissions:
      id-token: write # mandatory for trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/claude-session-teleporter
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
