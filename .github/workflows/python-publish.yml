# Publish to PyPI when a GitHub Release is published.
#
# Uses trusted publishing (OIDC), so there is no API token to store: configure
# the publisher once at https://pypi.org/manage/account/publishing/ against this
# repository, this workflow filename, and the `pypi` environment below.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pinned exactly: setup-uv stopped publishing floating major tags after
      # v7, so @v10 does not resolve
      - uses: astral-sh/setup-uv@v10.0.1

      # P3 already pins pyproject against __version__ (test_version_matches_the
      # _module), so this only has to tie the release tag to one of them. No toml
      # parser, so it runs on any interpreter uv picks.
      - name: The release tag must match the version we are about to publish
        run: |
          uv run --no-project python - <<'PY'
          import os, re
          tag = os.environ["TAG"].lstrip("v")
          proj = re.search(r'^version = "([^"]+)"', open("pyproject.toml", encoding="utf-8").read(), re.M)[1]
          assert tag == proj, f"release tag {tag!r} does not match pyproject version {proj!r}"
          print(f"ok: publishing {proj}")
          PY
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Test before publishing
        run: uv run --frozen pytest -q

      - name: Build release distributions
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: [release-build]
    permissions:
      id-token: write # mandatory for trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/claude-session-teleporter
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
