[project]
name = "claude-session-teleporter"
version = "1.1.0"                      # kept in step with __version__ by test_packaging.py
description = "Teleport Claude Code sessions between account/org partitions, and between WSL and the Windows desktop app"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "aviadr1" }]
keywords = ["claude", "claude-code", "sessions", "wsl", "migration"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

# Deliberately empty, and enforced by test_no_runtime_dependencies: this tool is
# a single standard-library script you can curl onto a machine and run. Packaging
# it must not quietly turn that into a lie.
dependencies = []

[project.urls]
Homepage = "https://github.com/aviadr1/claude-session-teleporter"
Issues = "https://github.com/aviadr1/claude-session-teleporter/issues"

[project.scripts]
claude-sessions = "claude_sessions:main"

[dependency-groups]
dev = ["pytest>=8", "tomli>=2 ; python_version < '3.11'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["claude_sessions.py"]

[tool.hatch.build.targets.sdist]
include = ["claude_sessions.py", "README.md", "INVARIANTS.md", "LICENSE", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "drift: checks the reverse-engineered formats against a real store on this machine; skips when there is none",
]
